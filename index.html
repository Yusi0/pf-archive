<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PF Archive</title>
  <meta name="description" content="Phantom Forces PF Revamp, 밸런스 패치, 총기/맵 리워크 분석 및 패치노트 아카이빙 블로그" />

  <!-- Apply saved theme and reading size before first paint (avoids flash / layout shift) -->
  <script>
    var root = document.documentElement;
    try {
      root.setAttribute('data-theme', localStorage.getItem('pf_theme') || 'dark');
      var scale = parseFloat(localStorage.getItem('pf_reading_scale'));
      if ([0.9, 1, 1.12, 1.25, 1.4].indexOf(scale) >= 0) root.style.setProperty('--reading-scale', String(scale));
    } catch (e) {
      root.setAttribute('data-theme', 'dark');
    }
  </script>

  <!-- Open Graph / Discord Embed -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PF Archive" />
  <meta property="og:url" content="https://yusi0.github.io/pf-archive/" />
  <meta property="og:title" content="PF Archive" />
  <meta property="og:description" content="Phantom Forces PF Revamp, 밸런스 패치, 총기/맵 리워크 분석 및 패치노트 아카이빙 블로그" />
  <meta name="theme-color" content="#1e1e1e" />

  <!-- Twitter Card -->

  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
</head>

</body>
